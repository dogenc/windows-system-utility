<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0a0e1a"/>
      <stop offset="1"    stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#00f0d4"/>
      <stop offset="0.5"  stop-color="#00c8ff"/>
      <stop offset="1"    stop-color="#4d7cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#00f0d4" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="55"
        fill="none" stroke="url(#rim)" stroke-width="3"/>

  <text x="128" y="148" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="80" font-weight="900" letter-spacing="1"
        fill="url(#accent)">WSU</text>

  <text x="128" y="185" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2"
        fill="#8ba4c4" opacity="0.7">DGKN</text>
</svg>
