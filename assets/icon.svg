<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0a0e1a"/>
      <stop offset="0.5"  stop-color="#0d1529"/>
      <stop offset="1"    stop-color="#0a0f1e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#00f0d4"/>
      <stop offset="0.35" stop-color="#00c8ff"/>
      <stop offset="0.7"  stop-color="#4d7cff"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#00f0d4"/>
      <stop offset="0.5"  stop-color="#00c8ff"/>
      <stop offset="1"    stop-color="#4d7cff"/>
    </linearGradient>

    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#00f0d4" stop-opacity="0.15"/>
      <stop offset="0.5"  stop-color="#00c8ff" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#4d7cff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#00f0d4" stop-opacity="0.6"/>
      <stop offset="0.3"  stop-color="#00c8ff" stop-opacity="0.2"/>
      <stop offset="0.7"  stop-color="#4d7cff" stop-opacity="0.15"/>
      <stop offset="1"    stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0"    stop-color="#00c8ff" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="52"/>
    </clipPath>
  </defs>

  <!-- Hintergrund -->
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#innerGlow)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>
  </g>

  <!-- Rand -->
  <rect x="9" y="9" width="238" height="238" rx="51"
        fill="none" stroke="url(#rimLight)" stroke-width="1.5"/>

  <!-- Dekorative Linien oben -->
  <line x1="40" y1="36" x2="216" y2="36" stroke="url(#accent2)" stroke-width="0.7" opacity="0.3"/>

  <!-- Hintergrund-Glow -->
  <ellipse cx="128" cy="100" rx="80" ry="50" fill="#00c8ff" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Terminal-Bracket links -->
  <g filter="url(#subtleGlow)" opacity="0.5">
    <path d="M38,70 L28,90 L38,110" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Terminal-Bracket rechts -->
  <g filter="url(#subtleGlow)" opacity="0.5">
    <path d="M218,70 L228,90 L218,110" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Haupttext: WSU -->
  <g filter="url(#textGlow)">
    <text x="128" y="107" text-anchor="middle"
          font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
          font-size="62" font-weight="900" letter-spacing="2"
          fill="url(#accent)">WSU</text>
  </g>

  <!-- Sekundaertext: WinSysUtil -->
  <text x="128" y="130" text-anchor="middle"
        font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
        font-size="14" font-weight="600" letter-spacing="5"
        fill="#8ba4c4" opacity="0.8">WinSysUtil</text>

  <!-- Trennlinie -->
  <line x1="60" y1="143" x2="196" y2="143" stroke="url(#accent2)" stroke-width="1" opacity="0.35"/>

  <!-- Fortschrittsbalken -->
  <rect x="72" y="155" width="112" height="6" rx="3" fill="#1a2540" opacity="0.8"/>
  <rect x="72" y="155" width="52" height="6" rx="3" fill="url(#accent2)" opacity="0.9"/>

  <!-- Dots auf dem Fortschrittsbalken -->
  <circle cx="124" cy="158" r="1.2" fill="#00c8ff" opacity="0.6"/>
  <circle cx="148" cy="158" r="1" fill="#4d7cff" opacity="0.4"/>
  <circle cx="168" cy="158" r="0.8" fill="#8b5cf6" opacity="0.3"/>

  <!-- DGKN@Labs -->
  <g filter="url(#subtleGlow)">
    <text x="128" y="185" text-anchor="middle"
          font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
          font-size="16" font-weight="700" letter-spacing="1.5"
          fill="url(#accent)">DGKN@Labs</text>
  </g>

  <!-- Kleine Grid-Punkte unten als Deko -->
  <g opacity="0.15">
    <circle cx="88"  cy="205" r="1" fill="#00c8ff"/>
    <circle cx="98"  cy="205" r="1" fill="#00c8ff"/>
    <circle cx="108" cy="205" r="1" fill="#00c8ff"/>
    <circle cx="118" cy="205" r="1" fill="#4d7cff"/>
    <circle cx="128" cy="205" r="1" fill="#4d7cff"/>
    <circle cx="138" cy="205" r="1" fill="#4d7cff"/>
    <circle cx="148" cy="205" r="1" fill="#8b5cf6"/>
    <circle cx="158" cy="205" r="1" fill="#8b5cf6"/>
    <circle cx="168" cy="205" r="1" fill="#8b5cf6"/>
    <circle cx="88"  cy="215" r="1" fill="#00c8ff"/>
    <circle cx="98"  cy="215" r="1" fill="#00c8ff"/>
    <circle cx="108" cy="215" r="1" fill="#4d7cff"/>
    <circle cx="118" cy="215" r="1" fill="#4d7cff"/>
    <circle cx="128" cy="215" r="1" fill="#4d7cff"/>
    <circle cx="138" cy="215" r="1" fill="#8b5cf6"/>
    <circle cx="148" cy="215" r="1" fill="#8b5cf6"/>
    <circle cx="158" cy="215" r="1" fill="#8b5cf6"/>
    <circle cx="168" cy="215" r="1" fill="#8b5cf6"/>
  </g>

  <!-- Dekorative Linie unten -->
  <line x1="40" y1="230" x2="216" y2="230" stroke="url(#accent2)" stroke-width="0.7" opacity="0.3"/>
</svg>
